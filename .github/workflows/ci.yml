name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test

      - name: Supabase local
        run: |
          npm run db:start
          npm run db:env
          npm run db:seed
      - name: Testes de segurança do banco
        run: npm run test:db
      - name: Tipos do banco estão atualizados
        run: |
          npm run db:types
          git diff --exit-code src/lib/supabase/database.types.ts

      - run: npm run build
      - name: Testes ponta a ponta
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
