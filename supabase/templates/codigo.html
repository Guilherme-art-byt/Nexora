<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #0a0a0f;
      font-family:
        system-ui,
        -apple-system,
        'Segoe UI',
        Roboto,
        sans-serif;
      color: #f4f4f8;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            style="
              max-width: 420px;
              background: #14141c;
              border: 1px solid #2a2a3a;
              border-radius: 16px;
              padding: 32px;
            "
          >
            <tr>
              <td>
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 20px;
                    font-weight: 700;
                    letter-spacing: 0.08em;
                    color: #c4b5fd;
                  "
                >
                  NEXORA
                </p>
                <p style="margin: 0 0 16px; font-size: 16px; line-height: 24px">
                  Use este código para continuar:
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 36px;
                    font-weight: 700;
                    letter-spacing: 0.3em;
                    color: #f4f4f8;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0; font-size: 14px; line-height: 20px; color: #9a9ab0">
                  O código vale por 1 hora. Se você não pediu este código, ignore este e-mail.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
